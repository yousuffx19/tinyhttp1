<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>C HTTP Server</title>
<link rel="stylesheet" href="style.css"/>
<style>
body{font-family:Arial,sans-serif;margin:40px;}
.card{max-width:600px;padding:24px;background:white;border-radius:10px}
button{padding:8px 14px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Hello from C!</h1>
<p>This page is being served by my own HTTP server.</p>
<p>Status: <strong id="status">Waiting...</strong></p>
<button onclick="test()">Test API</button>
</div>

<script>
function test(){
    document.getElementById("status").textContent="JavaScript works!";
}
</script>
</body>
</html>
